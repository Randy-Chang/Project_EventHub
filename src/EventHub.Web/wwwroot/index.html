<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EventHub 活動加入</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">EVENTHUB</p>
    <h1>加入活動</h1>
    <p id="status" class="status" aria-live="polite">請輸入活動資訊</p>

    <form id="join-form">
      <label>活動 ID<input id="event-id" autocomplete="off" required></label>
      <label>姓名<input id="name" autocomplete="name" maxlength="100" required></label>
      <label>暱稱<input id="nickname" maxlength="100"></label>
      <label>員工編號<input id="employee-number" maxlength="50"></label>
      <label>部門<input id="department" maxlength="100"></label>
      <label>桌次<input id="table-number" maxlength="50"></label>
      <button type="submit">加入活動</button>
    </form>

    <section id="joined" class="joined" hidden>
      <h2 id="welcome"></h2>
      <p>已連線到活動 Server。重新整理頁面仍會保留同一個身份。</p>

      <section id="quiz" class="quiz" aria-live="polite">
        <p class="quiz-kicker">快問快答</p>
        <h3 id="quiz-question">等待下一題…</h3>
        <p id="quiz-countdown" class="countdown" hidden></p>
        <div id="quiz-options" class="quiz-options"></div>
        <p id="quiz-message" class="quiz-message">主持人開始題目後會自動顯示。</p>
        <div id="quiz-score" class="quiz-score" hidden></div>
        <section id="leaderboard" class="leaderboard" hidden>
          <h4>即時排行榜 Top 5</h4>
          <ol id="leaderboard-list"></ol>
        </section>
      </section>
    </section>
  </main>

  <script src="vendor/signalr.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
